<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <title>NBRI Research Ecosystem</title>
  </head>
  <body>
    <main class="graph-shell">
      <header class="masthead">
        <p>National Building Research Institute</p>
        <h1>Research Ecosystem</h1>
      </header>

      <section class="research-search" aria-label="Researcher filters">
        <div class="search-heading">
          <label for="research-search">Find a Researcher</label>
          <div class="search-toolbar">
            <div class="name-search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg>
              <input id="research-search" type="search" placeholder="Search by name…" autocomplete="off" aria-controls="search-results" />
            </div>
          </div>
        </div>
        <div id="filter-panel">
          <button id="domain-filter-toggle" type="button" aria-expanded="false" aria-controls="domain-options">
            <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 4h18l-7 8v7l-4 2V12Z"/></svg>
            <span class="filter-label">Filter by Research Domain</span>
            <span id="domain-filter-count" hidden></span>
            <svg class="filter-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <fieldset id="domain-options" hidden><legend class="visually-hidden">Research Domain</legend></fieldset>
          <button id="clear-filters" type="button" hidden>Clear Filters</button>
        </div>
        <div id="search-body" hidden>
          <p id="search-status" role="status" hidden></p>
          <div id="search-results"></div>
        </div>
      </section>

      <section class="graph-stage" aria-label="NBRI organization graph">
        <div id="graph-viewport" tabindex="0" role="region" aria-label="Interactive research canvas" aria-describedby="graph-help">
        <svg id="graph" role="img" aria-busy="true" aria-labelledby="graph-title graph-desc">
          <title id="graph-title">NBRI research center organization graph</title>
          <desc id="graph-desc">
            Force-directed overview of NBRI researchers, collaborators, labs,
            lab members, and partner institutions.
          </desc>
        </svg>
        </div>
        <div class="graph-controls" aria-label="Graph view controls">
          <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
          <output id="zoom-level" aria-live="polite">100%</output>
          <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          <button id="fit-graph" type="button">Fit View</button>
          <button id="actual-size" type="button">100%</button>
        </div>
        <p id="graph-help">Drag to pan · Scroll or pinch to zoom · Fit View to reset</p>

        <aside
          class="node-info"
          aria-live="polite"
          aria-label="Selected node information"
        >
          <button id="close-profile" class="quiet-button" type="button" aria-label="Back to ecosystem overview" hidden>&times;</button>
          <div class="profile-heading">
            <h2 id="info-name">National Building Research Institute</h2>
            <div id="info-social" class="profile-social" aria-label="Academic profiles"></div>
          </div>
          <p id="info-subtitle"></p>
          <dl id="info-fields"></dl>
        </aside>
      </section>
    </main>

    <script src="./graph-data.js"></script>
    <script src="./profile.js"></script>
    <script src="./graph.js"></script>
  </body>
</html>
